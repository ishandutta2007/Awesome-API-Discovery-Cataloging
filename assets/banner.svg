<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#374151" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#6366f1" fill-opacity="0.4" />
    </pattern>

    <!-- Radial Glows -->
    <radialGradient id="glow-left" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-right" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.08); }
      }
      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
        50% { transform: translateY(-20px) translateX(15px); opacity: 0.8; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -100; }
      }
      @keyframes scanBeam {
        0% { transform: translateY(0px); opacity: 0; }
        30% { opacity: 0.6; }
        70% { opacity: 0.6; }
        100% { transform: translateY(380px); opacity: 0; }
      }
      .bg-pulse {
        animation: pulseGlow 8s ease-in-out infinite;
        transform-origin: center;
      }
      .particle-1 { animation: floatParticle 6s ease-in-out infinite; }
      .particle-2 { animation: floatParticle 8s ease-in-out infinite 1s; }
      .particle-3 { animation: floatParticle 7s ease-in-out infinite 2s; }
      .radar-line {
        transform-origin: 1050px 200px;
        animation: radarSweep 10s linear infinite;
      }
      .dash-flow {
        stroke-dasharray: 6 6;
        animation: dashMove 4s linear infinite;
      }
      .scan-line {
        animation: scanBeam 6s ease-in-out infinite;
      }
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 19px;
        letter-spacing: 0.2px;
      }
      .pill-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16" />

  <!-- Grid Pattern Overlay -->
  <rect width="1200" height="400" fill="url(#cyber-grid)" rx="16" />

  <!-- Ambient Dynamic Glows (in background) -->
  <circle cx="250" cy="180" r="280" fill="url(#glow-left)" class="bg-pulse" />
  <circle cx="980" cy="220" r="260" fill="url(#glow-right)" class="bg-pulse" />

  <!-- Decorative Circuit Nodes & Data Streams (Background layer) -->
  <g opacity="0.35">
    <path d="M 80 80 H 300 L 360 140 H 500" fill="none" stroke="#6366f1" stroke-width="1.5" class="dash-flow" />
    <path d="M 700 320 H 880 L 940 260 H 1120" fill="none" stroke="#ec4899" stroke-width="1.5" class="dash-flow" />
    <circle cx="360" cy="140" r="4" fill="#06b6d4" />
    <circle cx="940" cy="260" r="4" fill="#ec4899" />
  </g>

  <!-- Background Floating Network / Radar Graphic on Right Side -->
  <g opacity="0.45">
    <circle cx="1050" cy="200" r="120" fill="none" stroke="#4f46e5" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="1050" cy="200" r="80" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4" />
    <circle cx="1050" cy="200" r="40" fill="none" stroke="#ec4899" stroke-width="1" stroke-opacity="0.3" />
    <!-- Rotating radar scan beam -->
    <line x1="1050" y1="200" x2="1170" y2="200" stroke="#06b6d4" stroke-width="2" class="radar-line" stroke-linecap="round" />
  </g>

  <!-- Floating Particles in Background -->
  <circle cx="150" cy="120" r="3" fill="#60a5fa" class="particle-1" />
  <circle cx="280" cy="310" r="4" fill="#c084fc" class="particle-2" />
  <circle cx="920" cy="110" r="3" fill="#f472b6" class="particle-3" />
  <circle cx="820" cy="340" r="3.5" fill="#38bdf8" class="particle-1" />

  <!-- Subtle Scanning Laser Line (Backplane) -->
  <line x1="20" y1="0" x2="1180" y2="0" stroke="url(#primary-grad)" stroke-width="1.5" class="scan-line" opacity="0.3" />

  <!-- FOREGROUND LAYER: Content strictly positioned for crisp visibility -->
  
  <!-- Category Tag / Top Badge -->
  <g transform="translate(80, 75)">
    <rect width="215" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
    <circle cx="18" cy="16" r="5" fill="#22c55e" />
    <text x="32" y="21" fill="#c7d2fe" class="pill-text" font-weight="700">CURATED AWESOME LIST</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(80, 155)">
    <text fill="#ffffff" class="title-text">Awesome <tspan fill="url(#primary-grad)">API Discovery</tspan> &amp; Cataloging</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(80, 205)">
    <text fill="#94a3b8" class="subtitle-text">
      The authoritative guide to discovering shadow APIs, automated catalogs, eBPF sniffers &amp; attack surface defense.
    </text>
  </g>

  <!-- Feature Pills / Highlights in Foreground -->
  <g transform="translate(80, 260)">
    <!-- Pill 1: Shadow API Discovery -->
    <g transform="translate(0, 0)">
      <rect width="185" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="14" y="23" fill="#38bdf8" class="pill-text">⚡ SHADOW API DETECTION</text>
    </g>

    <!-- Pill 2: eBPF & Traffic Sniffing -->
    <g transform="translate(200, 0)">
      <rect width="180" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="14" y="23" fill="#a855f7" class="pill-text">🔍 eBPF &amp; TRAFFIC MIRRORS</text>
    </g>

    <!-- Pill 3: Internal Developer Portals -->
    <g transform="translate(395, 0)">
      <rect width="185" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="14" y="23" fill="#ec4899" class="pill-text">📚 IDPs &amp; API CATALOGS</text>
    </g>

    <!-- Pill 4: Attack Surface Management -->
    <g transform="translate(595, 0)">
      <rect width="210" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="14" y="23" fill="#4ade80" class="pill-text">🛡️ ATTACK SURFACE DEFENSE</text>
    </g>
  </g>

  <!-- Bottom Border Glow -->
  <rect x="0" y="394" width="1200" height="6" fill="url(#primary-grad)" rx="3" />
</svg>
